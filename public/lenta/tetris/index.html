<meta charset="utf-8">
<title>PVP TETRIS — 1v1 Block Battle</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  html, body {
    margin: 0; height: 100%;
    background: #05060c;
    overflow: hidden;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    color: #cdd6f4;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    overscroll-behavior: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at 50% 0%, #131a30 0%, #05060c 70%);
  }
  /* Sveikas mastelis + pixelated = aštrūs pikseliai, jokio blur.
   * Drobė perskaičiuojama taip, kad užpildytų langą, tad rėmelis matomas tik
   * kai langas mažesnis už projektinį 640x360. */
  #screen {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #0a0c14;
    box-shadow: 0 0 0 2px #1c2030, 0 16px 60px rgba(0,0,0,0.75);
    display: block;
  }
  /* Fullscreen režime jokių rėmelių ir šešėlių. */
  :fullscreen #screen, :-webkit-full-screen #screen { box-shadow: none; }

  /* --- jutiklinis valdymas (rodomas tik touch įrenginiuose) --- */
  #touchpad {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: none;
    justify-content: space-between;
    flex-wrap: wrap;   /* siauram ekranui: geriau dvi eilės negu nukirpti mygtukai */
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    gap: 8px;
    z-index: 5;
    pointer-events: none;
  }
  #touchpad .grp { display: flex; gap: 10px; pointer-events: auto; }
  #touchpad button {
    /* 08-13 rb97_swipe: liko tik 2 mygtukai (ROTATE + DROP) — judėjimas per SWIPE ant ekrano,
       todėl mygtukai dideli, kampuose, o vidurys laisvas pirštui braukti. */
    min-width: clamp(56px, 8vw, 68px); height: 74px;
    background: rgba(28,33,52,0.86);
    border: 1px solid #2a3050;
    border-radius: 10px;
    color: #cdd6f4;
    font: 600 19px/1 ui-monospace, monospace;
    padding: 0 12px;
  }
  #touchpad button.on { background: #3a4372; border-color: #f5c96b; color: #f5c96b; }
  #touchpad button.wide { min-width: clamp(110px, 30vw, 170px); }
</style>

<div id="wrap">
  <canvas id="screen"></canvas>
</div>

<div id="touchpad">
  <div class="grp">
    <button data-act="cw" class="wide">&#8635; ROTATE</button>
  </div>
  <div class="grp">
    <button data-act="hard" class="wide">DROP &#9660;</button>
  </div>
</div>
